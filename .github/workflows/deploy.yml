name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — confidential identifiers must not reach the public site
        env:
          BANNED_IDENTIFIERS: ${{ secrets.BANNED_IDENTIFIERS }}
        run: |
          if [ -n "$BANNED_IDENTIFIERS" ] && grep -rniE "$BANNED_IDENTIFIERS" src/ public/ README.md 2>/dev/null; then
            echo '::error::Banned identifier found in publishable files'
            exit 1
          fi
      - uses: withastro/action@v6
        env:
          SITE_MODE: preview # flip to 'production' + set PRODUCTION_SITE at domain cutover
        with:
          node-version: 24
      - name: Smoke — routes, noindex, links
        run: |
          npm ci
          node scripts/smoke.mjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
